name: release-cogmint

on:
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild (recovery only; no new tag is created).
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-tag:
    if: (github.event_name == 'create' && github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve and validate release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG=""
          if [ "$EVENT_NAME" = "create" ] && [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          fi

          VERSION="${TAG#v}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-tauri:
    needs: resolve-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            variant: windows-x64
            args: ''
            rust_target: ''
          - platform: macos-latest
            variant: macos-arm64
            args: '--target aarch64-apple-darwin'
            rust_target: 'aarch64-apple-darwin'
          - platform: macos-latest
            variant: macos-x64
            args: '--target x86_64-apple-darwin'
            rust_target: 'x86_64-apple-darwin'
          - platform: ubuntu-22.04
            variant: linux-x64
            args: ''
            rust_target: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux Tauri dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Build platform package
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
      - name: Stage exact release assets for central publisher
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
          VARIANT: ${{ matrix.variant }}
        run: node .github/scripts/stage-release-assets.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets-cogmint-${{ matrix.variant }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified cross-platform release assets
    needs: [resolve-tag, build-tauri]
    permissions:
      actions: read
      contents: read
    uses: ThanhNguyxnOrg/.github/.github/workflows/release-publish.yml@release-v1
    with:
      tag: ${{ needs.resolve-tag.outputs.tag }}
      artifact_pattern: release-assets-cogmint-*
    secrets:
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
