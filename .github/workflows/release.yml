name: release-cogmint

on:
  create

permissions:
  actions: read
  contents: read

jobs:
  build-and-release:
    if: github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package linux x64
        run: |
          mkdir -p dist/cogmint-linux-x64
          cp -r .output dist/cogmint-linux-x64/
          cp package.json dist/cogmint-linux-x64/
          tar -czf dist/cogmint-linux-x64.tar.gz -C dist cogmint-linux-x64

      - name: Package windows x64
        run: |
          mkdir -p dist/cogmint-windows-x64
          cp -r .output dist/cogmint-windows-x64/
          cp package.json dist/cogmint-windows-x64/
          cd dist && zip -r cogmint-windows-x64.zip cogmint-windows-x64

      - name: Package macos arm64
        run: |
          mkdir -p dist/cogmint-macos-arm64
          cp -r .output dist/cogmint-macos-arm64/
          cp package.json dist/cogmint-macos-arm64/
          tar -czf dist/cogmint-macos-arm64.tar.gz -C dist cogmint-macos-arm64

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Upload packaged assets for the shared publisher
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-cogmint
          path: |
            dist/cogmint-linux-x64.tar.gz
            dist/cogmint-windows-x64.zip
            dist/cogmint-macos-arm64.tar.gz
            dist/checksums.txt
          if-no-files-found: error

  publish:
    needs: build-and-release
    permissions:
      actions: read
      contents: read
    uses: ThanhNguyxnOrg/.github/.github/workflows/release-publish.yml@da9d02544f60aeec92f8c851846ee3a587044beb
    with:
      tag: ${{ github.event.ref }}
      artifact_pattern: release-assets-*
      artifact_directory: dist/release
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
