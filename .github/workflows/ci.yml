name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ThanhNguyxnOrg/.github/.github/workflows/ci-node.yml@3b9ff6de3e26a64ab1fbe049abf5e2cfc34dc7f1
    with:
      job_name: Typecheck
      node_version: "22"
      package_manager: bun
      package_manager_version: "1.4.4"
      cache: ""
      install_command: bun install --frozen-lockfile || bun install
      prepare_command: bun run postinstall
      typecheck_command: bun run typecheck
      test_command: bun run test
